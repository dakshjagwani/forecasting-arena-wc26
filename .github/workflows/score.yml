name: Daily score

on:
  schedule:
    # 01:15 UTC: scores the evening matches the same night.
    # 09:30 UTC: sweeps the late-night US games — last kickoffs run as late
    # as 07:00 UTC (FT ~08:55), which the old 06:00 cron missed by a day.
    # Scoring is idempotent, so running twice is free.
    - cron: '15 1 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs (two daily crons + manual dispatch) so they can't race each
# other on `git push`. Scoring is idempotent, so a queued run just recomputes.
concurrency:
  group: daily-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch results from football-data.org
        run: python scripts/fetch_results.py
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        continue-on-error: true  # graceful fallback: manual entry via results.json

      - name: Resolve knockout fixtures (a finished match can unlock the next round)
        run: python scripts/resolve_fixtures.py
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        continue-on-error: true  # never block scoring; placeholders just stay unfrozen

      - name: Compute Brier scores
        run: python scripts/score.py

      - name: Refresh pick-reminder calendar (site/picks.ics)
        run: python scripts/make_calendar.py

      - name: Validate data tree before committing
        run: python scripts/validate_data.py

      - name: Commit results and scores
        run: |
          git config user.name  "Forecasting Arena Bot"
          git config user.email "bot@forecasting-arena.com"
          git add data/results/ data/scores/ data/fixtures/ site/picks.ics
          git diff --staged --quiet || \
            git commit -m "score: $(date -u +%Y-%m-%d) [skip ci]"
          git push || (git pull --rebase --autostash && git push)
