name: Daily freeze

on:
  schedule:
    # ADAPTIVE WINDOW (docs/RELIABILITY.md): first kickoffs range 16:00Z to
    # 22:00Z across the tournament, so attempts fire every 30 minutes all
    # afternoon and freeze.py self-gates — too early → no-op, already
    # frozen → no-op, inside [first kickoff − 3h, kickoff) → freeze. GitHub's
    # cron is best-effort (it dropped a run on 2026-06-12), so ~18 attempts
    # per day make a missed window vanishingly unlikely; the external
    # cron-job.org trigger and healthchecks.io dead-man's switch cover a
    # full scheduler outage.
    - cron: '0,30 12-20 * * *'
  workflow_dispatch:   # manual trigger — also the incident-playbook path
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (UTC-8 campaign day); empty = today'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — query everything, write/commit nothing'
        type: boolean
        default: false
      remaining:
        description: 'Rescue mode — freeze only matches that have not kicked off yet (passed ones are void for everyone)'
        type: boolean
        default: false

permissions:
  contents: write
  models: read   # gpt-4o-mini via the free GitHub Models tier

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run freeze
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.remaining }}" = "true" ]; then ARGS="$ARGS --remaining"; fi
          python scripts/freeze.py $ARGS
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          SHEET_CSV_URL:       ${{ secrets.SHEET_CSV_URL }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}

      - name: Validate data tree before committing
        run: python scripts/validate_data.py

      - name: Commit predictions
        id: commit
        run: |
          git config user.name  "Forecasting Arena Bot"
          git config user.email "bot@forecasting-arena.com"
          git add data/predictions/
          if git diff --staged --quiet; then
            echo "froze=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "freeze: $(date -u +%Y-%m-%d) predictions [skip ci]"
            git push
            echo "froze=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify success
        # Only when this run actually froze the day — no-op attempts (too
        # early / already frozen) fire all afternoon and must stay silent.
        if: success() && inputs.dry_run != true && steps.commit.outputs.froze == 'true'
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: ✅ Freeze OK" \
            -H "Priority: default" \
            -d "$(date -u +%Y-%m-%d) freeze complete" || true

      - name: Dead-man's switch ping
        # Pings only while TODAY's predictions file exists — the invariant
        # being monitored is "the campaign day is frozen", so too-early
        # no-ops never ping and silence past the deadline raises the alarm.
        if: success() && inputs.dry_run != true
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          TODAY=$(date -u -d '8 hours ago' +%Y-%m-%d)
          if [ -n "$HEALTHCHECK_URL" ] && [ -f "data/predictions/$TODAY.json" ]; then
            curl -fsS --retry 3 "$HEALTHCHECK_URL" > /dev/null || true
          fi

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: 🚨 Freeze FAILED" \
            -H "Priority: urgent" \
            -d "$(date -u +%Y-%m-%d) freeze failed — check Actions logs NOW" || true
