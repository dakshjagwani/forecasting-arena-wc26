name: Daily freeze

on:
  schedule:
    # Defense in depth (docs/RELIABILITY.md): GitHub's cron is best-effort —
    # it skipped 18:00 entirely on 2026-06-12 (CHANGELOG). Three attempts on
    # off-peak minutes; an already-frozen day is a clean no-op, so retries
    # never false-alarm. An EXTERNAL trigger (cron-job.org → this workflow's
    # dispatch API) plus a healthchecks.io dead-man's switch cover the case
    # where GitHub's scheduler drops all three. For knockout rounds with
    # 17:00 UTC kickoffs move ALL crons ~2h earlier — and keep the freeze
    # time in site/picks.js (freezeTimeFor) in sync with the PRIMARY (17:45).
    - cron: '45 17 * * *'
    - cron: '20 18 * * *'
    - cron: '40 18 * * *'
  workflow_dispatch:   # manual trigger — also the incident-playbook path
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (UTC-8 campaign day); empty = today'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — query everything, write/commit nothing'
        type: boolean
        default: false
      remaining:
        description: 'Rescue mode — freeze only matches that have not kicked off yet (passed ones are void for everyone)'
        type: boolean
        default: false

permissions:
  contents: write
  models: read   # gpt-4o-mini via the free GitHub Models tier

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run freeze
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.remaining }}" = "true" ]; then ARGS="$ARGS --remaining"; fi
          python scripts/freeze.py $ARGS
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          SHEET_CSV_URL:       ${{ secrets.SHEET_CSV_URL }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}

      - name: Validate data tree before committing
        run: python scripts/validate_data.py

      - name: Commit predictions
        run: |
          git config user.name  "Forecasting Arena Bot"
          git config user.email "bot@forecasting-arena.com"
          git add data/predictions/
          git diff --staged --quiet || \
            git commit -m "freeze: $(date -u +%Y-%m-%d) predictions [skip ci]"
          git push

      - name: Notify success
        if: success() && inputs.dry_run != true
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: ✅ Freeze OK" \
            -H "Priority: default" \
            -d "$(date -u +%Y-%m-%d) freeze complete" || true

      - name: Dead-man's switch ping
        # healthchecks.io expects this ping daily by its deadline; if NOTHING
        # ran (scheduler silently dead), the absence of the ping raises the
        # alarm — a failure email can't catch a job that never started.
        if: success() && inputs.dry_run != true
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS --retry 3 "$HEALTHCHECK_URL" > /dev/null || true
          fi

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: 🚨 Freeze FAILED" \
            -H "Priority: urgent" \
            -d "$(date -u +%Y-%m-%d) freeze failed — check Actions logs NOW" || true
