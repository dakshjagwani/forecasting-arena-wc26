name: Daily freeze

on:
  schedule:
    # GitHub cron is now a BACKUP only. It proved unreliable in practice —
    # configured for ~18 runs/day it fired only 6, ~90 min apart, on both
    # 2026-06-13 and -14 (GitHub delays/drops scheduled runs under load).
    # The PRIMARY trigger is cron-job.org hitting this workflow's dispatch
    # API every 3 minutes (docs/RELIABILITY.md), so the freeze lands within
    # ~3 min of the window opening. freeze.py self-gates either way:
    # too early → no-op, already frozen → no-op, inside the 3h window → freeze.
    - cron: '0,30 12-20 * * *'
  workflow_dispatch:   # manual trigger — also the incident-playbook path
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (UTC-8 campaign day); empty = today'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — query everything, write/commit nothing'
        type: boolean
        default: false
      remaining:
        description: 'Rescue mode — freeze only matches that have not kicked off yet (passed ones are void for everyone)'
        type: boolean
        default: false

permissions:
  contents: write
  models: read   # gpt-4o-mini via the free GitHub Models tier

# Serialise runs: cron-job.org polls every 3 min but a freeze can take >3 min
# (retry sweep), so without this two runs overlap and race on `git push` — the
# loser is rejected non-fast-forward and false-alarms a "Freeze FAILED" right
# after the real success (seen 2026-06-18). One run at a time; overlapping
# polls queue then no-op ("already frozen"). NEVER cancel an in-flight freeze.
concurrency:
  group: daily-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Pull resolved knockout teams + corrected kickoff times from
      # football-data.org BEFORE freezing, so freeze.py reads real teams and the
      # 3h window is computed off the real first-kickoff. Stale times would
      # otherwise freeze a knockout match after it kicks off and void it.
      - name: Resolve knockout fixtures (teams + kickoff times)
        id: resolve
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/resolve_fixtures.py --dry-run
            exit 0
          fi
          python scripts/resolve_fixtures.py
          git config user.name  "Forecasting Arena Bot"
          git config user.email "bot@forecasting-arena.com"
          if git diff --quiet data/fixtures/fixtures.json; then
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/make_calendar.py        # times/teams changed
            python scripts/validate_data.py        # never commit a broken tree
            git add data/fixtures/fixtures.json site/picks.ics data/reference/
            git commit -m "fixtures: resolve knockout teams/times $(date -u +%Y-%m-%d) [skip ci]"
            git push || (git pull --rebase --autostash && git push)
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
              -H "Title: 🗓️ Knockout fixtures resolved" \
              -d "$(date -u +%Y-%m-%d): knockout teams/times updated from football-data.org" || true
          fi

      - name: Run freeze
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.remaining }}" = "true" ]; then ARGS="$ARGS --remaining"; fi
          python scripts/freeze.py $ARGS
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          SHEET_CSV_URL:       ${{ secrets.SHEET_CSV_URL }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}

      - name: Validate data tree before committing
        run: python scripts/validate_data.py

      - name: Commit predictions
        id: commit
        run: |
          git config user.name  "Forecasting Arena Bot"
          git config user.email "bot@forecasting-arena.com"
          git add data/predictions/ data/reference/
          if git diff --staged --quiet; then
            echo "froze=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "freeze: $(date -u +%Y-%m-%d) predictions [skip ci]"
            # Self-healing push: if origin advanced via a benign concurrent
            # commit (different files), rebase and retry rather than false-fail.
            git push || (git pull --rebase --autostash && git push)
            echo "froze=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify success
        # Only when this run actually froze the day — no-op attempts (too
        # early / already frozen) fire all afternoon and must stay silent.
        if: success() && inputs.dry_run != true && steps.commit.outputs.froze == 'true'
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: ✅ Freeze OK" \
            -H "Priority: default" \
            -d "$(date -u +%Y-%m-%d) freeze complete" || true

      - name: Dead-man's switch ping
        # Pings only while TODAY's predictions file exists — the invariant
        # being monitored is "the campaign day is frozen", so too-early
        # no-ops never ping and silence past the deadline raises the alarm.
        if: success() && inputs.dry_run != true
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          TODAY=$(date -u -d '8 hours ago' +%Y-%m-%d)
          if [ -n "$HEALTHCHECK_URL" ] && [ -f "data/predictions/$TODAY.json" ]; then
            curl -fsS --retry 3 "$HEALTHCHECK_URL" > /dev/null || true
          fi

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: 🚨 Freeze FAILED" \
            -H "Priority: urgent" \
            -d "$(date -u +%Y-%m-%d) freeze failed — check Actions logs NOW" || true
