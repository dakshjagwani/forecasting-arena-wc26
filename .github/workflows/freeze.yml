name: Daily freeze

on:
  schedule:
    # Primary 17:45 UTC + retry 18:20 UTC daily, before group-stage kickoffs
    # (earliest 19:00 UTC). GitHub drops/delays xx:00 crons under load — it
    # skipped 18:00 entirely on 2026-06-12 (CHANGELOG) — so we run off-peak
    # minutes and a second attempt. The retry is a clean no-op if the first
    # succeeded (freeze.py exits 0 on already-frozen). For knockout rounds
    # with 17:00 UTC kickoffs move BOTH crons ~2h earlier — and keep the
    # freeze time in site/picks.js (freezeTimeFor) in sync with the PRIMARY.
    - cron: '45 17 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:   # manual trigger — also the incident-playbook path
    inputs:
      date:
        description: 'Target date YYYY-MM-DD (UTC-8 campaign day); empty = today'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — query everything, write/commit nothing'
        type: boolean
        default: false

permissions:
  contents: write
  models: read   # gpt-4o-mini via the free GitHub Models tier

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run freeze
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/freeze.py $ARGS
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          SHEET_CSV_URL:       ${{ secrets.SHEET_CSV_URL }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}

      - name: Validate data tree before committing
        run: python scripts/validate_data.py

      - name: Commit predictions
        run: |
          git config user.name  "Forecasting Arena Bot"
          git config user.email "bot@forecasting-arena.com"
          git add data/predictions/
          git diff --staged --quiet || \
            git commit -m "freeze: $(date -u +%Y-%m-%d) predictions [skip ci]"
          git push

      - name: Notify success
        if: success() && inputs.dry_run != true
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: ✅ Freeze OK" \
            -H "Priority: default" \
            -d "$(date -u +%Y-%m-%d) freeze complete" || true

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/forecasting-arena-daksh" \
            -H "Title: 🚨 Freeze FAILED" \
            -H "Priority: urgent" \
            -d "$(date -u +%Y-%m-%d) freeze failed — check Actions logs NOW" || true
